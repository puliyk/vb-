<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>代码解释器 · 智能说明书仪表板</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --bg-deep: #0B0E17;
  --surface: #111827;
  --surface2: #0F1222;
  --border: #1F2A44;
  --text: #F0F3FA;
  --text2: #8B9DC3;
  --accent: #3B82F6;
  --accent2: #60A5FA;
  --success: #34D399;
  --error: #F87171;
  --warning: #F59E0B;
  --radius: 16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg-deep);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--text);line-height:1.5;
}
.dashboard{display:flex;min-height:100vh}
.sidebar{
  width:260px;background:var(--surface2);border-right:1px solid var(--border);
  padding:24px 20px;display:flex;flex-direction:column;gap:24px;flex-shrink:0;
}
.profile{text-align:center;border-bottom:1px solid var(--border);padding-bottom:20px}
.avatar{
  width:72px;height:72px;background:linear-gradient(135deg,var(--accent),#8B5CF6);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;font-size:28px;font-weight:bold;color:#fff;
}
.profile h3{font-size:18px;font-weight:600}.profile p{font-size:12px;color:var(--text2);margin-top:4px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:12px;color:var(--text2);font-size:14px;transition:all .2s;cursor:pointer;
}
.nav-item.active{background:rgba(59,130,246,0.12);color:#fff}
.nav-item .nav-icon{font-size:18px}
.nav-footer{margin-top:auto;font-size:11px;color:#4B5563}
.main{flex:1;padding:24px 28px 24px 24px;overflow-x:auto}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.dashboard-title h1{font-size:26px;font-weight:700}
.dashboard-title p{color:var(--text2);font-size:13px}
.activity-badge{
  background:var(--surface);padding:8px 16px;border-radius:32px;
  font-size:13px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);
}
.activity-badge select{
  background:transparent;border:none;color:#fff;outline:none;font-size:13px;font-family:inherit;cursor:pointer;
}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;
}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2)}
.stat-value{font-size:32px;font-weight:700;margin-top:8px;color:var(--text)}
.stat-unit{font-size:14px;font-weight:400;color:var(--text2)}
.stat-trend{font-size:11px;margin-top:4px;font-weight:500}
.stat-trend.up{color:var(--success)}
.stat-trend.neutral{color:var(--text2)}
.stat-trend.new{color:var(--accent2)}

.core-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:1000px){.core-grid{grid-template-columns:1fr}.sidebar{display:none}}
.code-panel,.doc-panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;
}
.panel-header{
  padding:14px 18px;background:rgba(15,23,42,0.6);border-bottom:1px solid var(--border);
  font-weight:600;font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.code-input{
  width:100%;min-height:300px;padding:16px;
  font-family:'Fira Code','Cascadia Code',Consolas,monospace;font-size:13px;
  background:#0A0F1A;border:none;color:#E2E8F0;resize:vertical;outline:none;line-height:1.7;tab-size:4;
}
.code-input::placeholder{color:#4B5563}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  background:var(--border);border:none;color:var(--text);padding:7px 14px;
  border-radius:32px;cursor:pointer;font-size:12px;font-weight:500;transition:all .2s;
  display:inline-flex;align-items:center;gap:6px;font-family:inherit;
}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#2563eb}
.btn:hover{background:#2D3A5E}

.tabs{display:flex;border-bottom:1px solid var(--border);background:rgba(15,23,42,0.6)}
.tab{
  flex:1;padding:12px;background:transparent;border:none;color:var(--text2);
  font-weight:500;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s;
}
.tab.active{color:#fff;border-bottom:2px solid var(--accent);background:var(--surface)}
.doc-content{
  padding:18px;min-height:300px;max-height:420px;overflow-y:auto;
  font-size:13px;background:#0A0F1A;line-height:1.7;
}

.insight-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:900px){.insight-row{grid-template-columns:1fr}}
.insight-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;
}
.card-title{
  font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.performer-list p,.channel-list p{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;
}
.percentage{color:var(--success);font-weight:600}

.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:900px){.bottom-grid{grid-template-columns:1fr}}
.badge-wall{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge-item{background:rgba(30,41,59,0.6);border-radius:14px;padding:12px;text-align:center;transition:opacity .2s;border:1px solid transparent}
.badge-item.unlocked{background:rgba(59,130,246,0.1);border-color:var(--accent)}
.badge-item.locked{opacity:.45}
.badge-icon{font-size:22px;margin-bottom:4px}
.badge-name{font-size:12px;font-weight:600;margin-bottom:4px}
.badge-progress{font-size:11px;color:var(--text2);margin-top:2px}
.badge-item.unlocked .badge-progress{color:var(--accent2)}

.history-list{list-style:none;max-height:180px;overflow-y:auto}
.history-list li{
  padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);transition:color .2s;
}
.history-list li:hover{color:var(--accent2)}
.history-func{font-weight:600;color:var(--text);font-family:'Fira Code',monospace;margin-right:6px}
.history-code{color:var(--text2);font-size:11px;display:block;margin-top:2px}

.footer-actions{margin-top:24px;display:flex;justify-content:flex-end;gap:16px;border-top:1px solid var(--border);padding-top:16px}
.footer-actions button{background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:12px;font-family:inherit}
.footer-actions button:hover{color:#fff}

.detail-section{margin-bottom:18px}
.detail-section h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);margin-bottom:8px}
.detail-section pre{
  background:rgba(0,0,0,.3);padding:10px 14px;border-radius:8px;font-size:13px;
  font-family:'Fira Code',monospace;overflow-x:auto;white-space:pre-wrap;line-height:1.6;
}
.detail-section table{width:100%;border-collapse:collapse;margin:8px 0}
.detail-section th,.detail-section td{border:1px solid var(--border);padding:7px 10px;text-align:left;font-size:12px}
.detail-section th{background:rgba(15,23,42,0.6);color:var(--text2)}
.detail-section ul{padding-left:16px;font-size:12px}

.narrative-box{
  background:rgba(59,130,246,0.06);border-left:3px solid var(--accent);
  border-radius:0 12px 12px 0;padding:16px 18px;line-height:1.9;font-size:13px;
}

.health-bar-track{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin:10px 0}
.health-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.health-bar-fill.good{background:var(--success)}
.health-bar-fill.warn{background:var(--warning)}
.health-bar-fill.bad{background:var(--error)}
.health-metrics{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--text2);margin-top:4px}
.health-metrics span{margin-right:12px}

.toast{position:fixed;bottom:24px;right:24px;background:var(--accent);color:#fff;padding:10px 20px;border-radius:32px;font-size:13px;font-weight:600;z-index:2000;animation:fadeInUp .3s}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Full Stats 弹窗 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;width:90%;max-width:480px;max-height:80vh;overflow-y:auto}
.modal-box h2{font-size:20px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.modal-close{background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:18px;float:right;padding:4px 8px;border-radius:6px}
.modal-close:hover{color:#fff;background:var(--border)}
.modal-stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.modal-stat-row:last-child{border-bottom:none}
.modal-stat-val{font-weight:700;font-family:'Fira Code',monospace}

.loading{display:inline-block;width:14px;height:14px;border:2px solid var(--accent2);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<!-- Full Stats Modal -->
<div class="modal-overlay" id="statsModal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin-bottom:0">&#x25A0; Full Stats</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div style="margin-top:20px" id="modalStatsContent"></div>
  </div>
</div>

<div class="dashboard">
  <div class="sidebar">
    <div class="profile">
      <div class="avatar">&lt;/&gt;</div>
      <h3>代码解释器</h3>
      <p>智能说明书 · 本地解析</p>
    </div>
    <div class="nav-item active" data-nav="dashboard" onclick="scrollToSection('top')"><span class="nav-icon">&#x25A0;</span> 仪表盘</div>
    <div class="nav-item" data-nav="doc" onclick="scrollToSection('core')"><span class="nav-icon">&#x25A0;</span> 说明书</div>
    <div class="nav-item" data-nav="badges" onclick="scrollToSection('bottom')"><span class="nav-icon">&#x25A0;</span> 成就</div>
    <div class="nav-footer">v3.0 · 无后端 · 纯前端</div>
  </div>

  <div class="main">
    <div class="top-bar">
      <div class="dashboard-title">
        <h1>Dashboard</h1>
        <p>代码解析统计与智能说明书仪表板</p>
      </div>
      <div class="activity-badge">
        <span>&#x25CF; Activity</span>
        <select id="langSelect">
          <option value="java">Java</option>
          <option value="python">Python</option>
        </select>
      </div>
    </div>

    <div class="stats-row" id="sectionTop">
      <div class="stat-card"><div class="stat-label">总解析次数</div><div class="stat-value" id="totalParses">0</div><div class="stat-trend neutral" id="trendTotal">-</div></div>
      <div class="stat-card"><div class="stat-label">Java 解析</div><div class="stat-value" id="javaCount">0</div><div class="stat-trend neutral" id="trendJava">-</div></div>
      <div class="stat-card"><div class="stat-label">Python 解析</div><div class="stat-value" id="pythonCount">0</div><div class="stat-trend neutral" id="trendPython">-</div></div>
      <div class="stat-card"><div class="stat-label">平均耗时</div><div class="stat-value" id="avgTime">0 <span class="stat-unit">ms</span></div><div class="stat-trend neutral" id="trendAvg">-</div></div>
    </div>

    <div class="core-grid" id="sectionCore">
      <div class="code-panel">
        <div class="panel-header">
          <span>代码片段</span>
          <div class="btn-group">
            <button class="btn btn-primary" id="parseBtn">生成说明书</button>
            <button class="btn" id="copyTechBtn">复制技术版</button>
            <button class="btn" id="exportImgBtn">导出卡片</button>
          </div>
        </div>
        <textarea id="codeInput" class="code-input" placeholder='粘贴 Java / Python 函数代码...&#10;例如：public int add(int a, int b) { return a + b; }'></textarea>
        <div id="loadingIndicator" style="display:none;padding:1rem;text-align:center;color:var(--text2)"><span class="loading"></span> 解析中...</div>
      </div>
      <div class="doc-panel">
        <div class="tabs">
          <button class="tab active" data-tab="tech">技术版说明书</button>
          <button class="tab" data-tab="beginner">小白版说明书</button>
        </div>
        <div id="techDoc" class="doc-content">点击「生成说明书」查看技术解析</div>
        <div id="beginnerDoc" class="doc-content" style="display:none">点击「生成说明书」查看生动解释</div>
      </div>
    </div>

    <div class="insight-row">
      <div class="insight-card">
        <div class="card-title">&#x25B2; Top performers (热门模式)</div>
        <div id="patternRanking" class="performer-list"><p style="color:var(--text2)">暂无数据</p></div>
      </div>
      <div class="insight-card">
        <div class="card-title">&#x25CF; Channels (比喻命中率)</div>
        <div id="metaphorStats" class="channel-list"><p style="color:var(--text2)">暂无数据</p></div>
      </div>
    </div>

    <div class="bottom-grid" id="sectionBottom">
      <div class="insight-card">
        <div class="card-title">&#x2605; 我的成就</div>
        <div id="badgeWall" class="badge-wall"></div>
      </div>
      <div class="insight-card">
        <div class="card-title">&#x23F1; 最近解析</div>
        <ul class="history-list" id="historyList"><li style="color:var(--text2)">暂无记录</li></ul>
      </div>
    </div>

    <div class="footer-actions">
      <button id="fullStatsBtn">Full Stats</button>
      <button id="logoutBtn">Log out (重置数据)</button>
    </div>
  </div>
</div>

<script>
// ==================== 比喻库 (38条-概念域映射) ====================
const METAPHOR_LIBRARY = [
  {keywords:['sort','排序','sorted','orderby'],concept:'排序',metaphor:'整理一叠乱序的扑克牌',action:'把杂乱无章的东西按照一定的规则排列整齐',inputDesc:'乱序的数据集合',outputDesc:'排好顺序的数据'},
  {keywords:['filter','过滤','where','筛选'],concept:'过滤',metaphor:'用筛子筛面粉',action:'把符合要求的东西留下来，不符合的挡在外面',inputDesc:'混合着粗细颗粒的数据',outputDesc:'只含符合要求的部分'},
  {keywords:['map','映射','transform','转换','apply'],concept:'映射',metaphor:'给一篮苹果逐个贴上标签变成新的果篮',action:'对每一个元素进行相同的变换操作',inputDesc:'原始数据集合',outputDesc:'每个元素经过变换后的新集合'},
  {keywords:['reduce','聚合','fold','accumulate','sum'],concept:'聚合',metaphor:'把一把零钱换成一张大钞',action:'将分散的多项数据合并浓缩为一个结果',inputDesc:'多项分散的数据',outputDesc:'一个综合的结果'},
  {keywords:['recursion','recursive','递归'],concept:'递归',metaphor:'一层层打开俄罗斯套娃直到最小的那个',action:'把大问题层层分解为同类的小问题，到底后再逐层返回答案',inputDesc:'一个复杂的问题',outputDesc:'分解到最底层后汇总出的答案'},
  {keywords:['read','读取','readfile','open'],concept:'读取',metaphor:'打开冰箱门拿出食物',action:'从外部获取需要的信息而无需了解底层原理',inputDesc:'一个文件路径或数据源地址',outputDesc:'文件中的内容'},
  {keywords:['write','写入','writefile','save','保存'],concept:'写入',metaphor:'在日记本上记录当天的想法',action:'把处理好的信息一笔一划地存到指定位置',inputDesc:'要保存的数据和目标位置',outputDesc:'持久化保存的确认'},
  {keywords:['search','查找','find','搜索','indexof','contains'],concept:'查找',metaphor:'在图书馆里按编号找书',action:'从一大堆数据中快速定位你要的那个目标',inputDesc:'要查找的目标和搜索范围',outputDesc:'目标数据的位置或内容'},
  {keywords:['loop','循环','for','while','foreach','遍历','iterate'],concept:'循环',metaphor:'流水线上的工人逐一检查每个零件',action:'对一组数据中的每一个元素，不厌其烦地重复相同的操作',inputDesc:'一组数据',outputDesc:'每个元素都经过处理后的结果'},
  {keywords:['if','else','条件','判断','switch','分支'],concept:'条件判断',metaphor:'站在岔路口看路标选方向',action:'根据不同的情况选择不同的处理方式',inputDesc:'一个需要判断的条件',outputDesc:'根据条件走不同分支后的结果'},
  {keywords:['function','方法','函数','def'],concept:'函数',metaphor:'看菜谱做菜',action:'按照写好的步骤接受原材料做出成品',inputDesc:'原材料（参数）',outputDesc:'做好的菜（返回值）'},
  {keywords:['class','类','对象','object','new'],concept:'类',metaphor:'按照设计蓝图造车',action:'作为模板定义属性和行为',inputDesc:'一个类的定义',outputDesc:'按蓝图创建的对象实例'},
  {keywords:['array','list','数组','列表','集合'],concept:'列表',metaphor:'一张可以涂改的购物清单',action:'把要处理的东西一行行列出来',inputDesc:'零散的数据项',outputDesc:'组织好的数据列表'},
  {keywords:['dictionary','dict','map','hashmap','字典','键值'],concept:'字典',metaphor:'一本可以快速翻查的通讯录',action:'给每个值配一个唯一的名字，想查什么按名字找',inputDesc:'键值对数据',outputDesc:'按名查到的对应值'},
  {keywords:['try','catch','except','异常','错误处理','exception'],concept:'异常处理',metaphor:'汽车的安全气囊',action:'平时不显山露水，一旦出了意外就立刻启动保护',inputDesc:'可能出错的代码段',outputDesc:'要么正常执行，要么被安全兜住'},
  {keywords:['import','require','引入','依赖','from','include'],concept:'引入依赖',metaphor:'做菜前去隔壁借好刀好锅',action:'借用别人写好的工具',inputDesc:'需要借用的模块名',outputDesc:'引入的外部功能'},
  {keywords:['variable','变量','赋值','let','const'],concept:'变量',metaphor:'一张可以随时改写的便利贴',action:'临时存一个值，不用了就可以换掉',inputDesc:'要存储的值',outputDesc:'贴有内容的变量'},
  {keywords:['string','字符串','文本','str'],concept:'字符串',metaphor:'一串可以拆开重组的字母珠链',action:'存储和操作文本，可以拼接、截断、替换',inputDesc:'一段文字',outputDesc:'处理后的文字'},
  {keywords:['api','http','fetch','请求','request','curl'],concept:'API调用',metaphor:'在餐厅点餐等上菜',action:'告诉对方你需要什么，然后等待对方把结果端上来',inputDesc:'请求的地址和参数',outputDesc:'服务端返回的数据'},
  {keywords:['cache','缓存','memo','记忆'],concept:'缓存',metaphor:'记性特别好的助手',action:'第一次算出来就记住，下次直接拿出来用不再重算',inputDesc:'需要计算的数据',outputDesc:'要么即时计算、要么从缓存中直接拿到'},

// ==================== 解析引擎 ====================
function splitParams(str){
  var parts=[],depth=0,current='';
  for(var i=0;i<str.length;i++){
    var ch=str[i];
    if(ch===','&&depth===0){parts.push(current);current='';}
    else{if('<([{'.indexOf(ch)!==-1)depth++;if('>)]}'.indexOf(ch)!==-1)depth--;current+=ch}
  }
  var t=current.trim();if(t)parts.push(t);return parts;
}
function escapeHtml(str){
  if(!str)return'';var d=document.createElement('div');d.textContent=str;return d.innerHTML;
}
function parseJava(code){
  var r={methodName:'',parameters:[],returnType:'',dependencies:[],hasTryCatch:false,rawCode:code.trim()};
  var ir=/import\s+([\w.]+(?:\s*\.\s*\*)?)\s*;/g,m;
  while((m=ir.exec(code))!==null)r.dependencies.push(m[1]);
  r.hasTryCatch=/try\s*\{/.test(code);
  var mr=/(?:(?:public|private|protected)\s+)?(?:static\s+)?(?:final\s+)?(?:synchronized\s+)?([\w.]+(?:<[^>]*>)?(?:\[\])?)\s+(\w+)\s*\(([^)]*)\)/;
  var mm=code.match(mr);
  if(mm){
    r.returnType=mm[1];r.methodName=mm[2];
    var ps=mm[3].trim();
    if(ps){r.parameters=splitParams(ps).map(function(p){var pts=p.trim().split(/\s+/);var n=pts.pop()||'';var t=pts.join(' ')||'Object';return{name:n,type:t};})}
  }else{r.methodName='未命名方法';r.returnType='void'}
  return r;
}
function parsePython(code){
  var r={methodName:'',parameters:[],returnType:'',dependencies:[],hasTryCatch:false,rawCode:code.trim()};
  var ir=/^(?:import|from)\s+([\w.]+)/gm,m;
  while((m=ir.exec(code))!==null)r.dependencies.push(m[1]);
  r.hasTryCatch=/try\s*:/i.test(code);
  var dr=/def\s+(\w+)\s*\(([^)]*)\)\s*(?:->\s*(\w+))?\s*:/;
  var dm=code.match(dr);
  if(dm){
    r.methodName=dm[1];r.returnType=dm[3]||'Any';
    var ps=dm[2].trim();
    if(ps&&ps!=='self'){r.parameters=splitParams(ps).filter(function(p){var n=p.trim().split(/\s*[:=]/)[0].trim();return n!=='self'&&n!=='cls'}).map(function(p){var t=p.trim(),n=t;var ei=t.indexOf('=');var bd=ei>=0?t.substring(0,ei).trim():t;var ci=bd.indexOf(':');if(ci>=0){n=bd.substring(0,ci).trim();var tp=bd.substring(ci+1).trim();return{name:n,type:tp}}return{name:bd,type:'Any'}})};
  }else{r.methodName='未命名函数';r.returnType='void'}
  return r;
}

// ==================== 比喻匹配 ====================
function matchMetaphorEntry(code,parsed){
  var cl=(parsed.methodName+' '+code).toLowerCase(),best=0,entry=null;
  for(var i=0;i<METAPHOR_LIBRARY.length;i++){
    var e=METAPHOR_LIBRARY[i],score=0;
    for(var j=0;j<e.keywords.length;j++){if(cl.indexOf(e.keywords[j].toLowerCase())!==-1)score+=2}
    if(score>best){best=score;entry=e}
  }
  return{entry:entry||DEFAULT_METAPHOR_ENTRY,matchQuality:best>4?'strong':best>0?'moderate':'fallback',firstKeyword:entry?entry.keywords[0]:'generic'};
}

// ==================== 洞察 + 模式检测 ====================
function detectPatterns(parsed,code){
  var cl=code.toLowerCase(),p=[];var fn=parsed.methodName.toLowerCase();
  if(new RegExp(fn+'\\s*\\(','i').test(code))p.push('递归');
  if(/sort|sorted/.test(cl)||/pivot|partition/.test(cl))p.push('排序');
  if(/cache|memo|memoize|缓存/.test(cl))p.push('缓存');
  if(parsed.hasTryCatch)p.push('防御性编程');
  if(/factory|create|build|new\s+\w+/.test(cl)&&/return\s+new/.test(code))p.push('工厂模式');
  if(/validate|check|验证|校验|assert/.test(cl))p.push('校验');
  if(/read|write|open|file|io|http|fetch|request/.test(cl))p.push('I/O');
  if(/loop|for|while|foreach|遍历|循环/.test(cl))p.push('循环');
  if(/if|else|条件|判断|switch|分支/.test(cl))p.push('条件分支');
  if(parsed.dependencies.length>0)p.push('模块化');
  if(p.length===0)p.push('通用处理');
  return p;
}

// ==================== 健康度评分 ====================
function calculateHealthScore(code,parsedParams){
  var score=100,deductions=[];
  if(parsedParams.length>3){var pp=(parsedParams.length-3)*5;score-=pp;deductions.push({label:'参数数量',value:parsedParams.length+'个',penalty:'-'+pp})}
  var lines=code.split('\n').length;
  if(lines>20){var lp=Math.floor((lines-20)/10)*5;score-=lp;deductions.push({label:'代码行数',value:lines+'行',penalty:'-'+lp})}
  var maxDepth=0;var la=code.split('\n');
  for(var i=0;i<la.length;i++){var lead=la[i].length-la[i].trimStart().length;var depth=Math.floor(lead/4);if(depth>maxDepth)maxDepth=depth}
  if(maxDepth>3){var dp=(maxDepth-3)*4;score-=dp;deductions.push({label:'嵌套深度',value:maxDepth+'层',penalty:'-'+dp})}
  var cm=(code.match(/if|for|while|&&|\|\||except/g)||[]).length+1;
  if(cm>5){var cp=(cm-5)*3;score-=cp;deductions.push({label:'圈复杂度',value:cm+'',penalty:'-'+cp})}
  if(parsedParams.length<=2&&lines<=10)score=Math.min(100,score+5);
  score=Math.max(0,Math.min(100,score));
  var suggestions=[];
  if(parsedParams.length>3)suggestions.push('参数过多，考虑用对象封装');
  if(lines>20)suggestions.push('函数较长，建议拆分');
  if(maxDepth>3)suggestions.push('嵌套较深，可提取内层逻辑');
  if(cm>5)suggestions.push('分支较多，考虑策略模式');
  return{score:score,level:score>=80?'good':score>=50?'warn':'bad',deductions:deductions,suggestions:suggestions};
}

// ==================== 语句解释 ====================
function generateStatementExplanation(code,lang){
  var lines=code.split('\n'),explanations=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line||/^(#|\/\/|\/\*|\*|import\s|from\s|package\s|@|\{|\})/.test(line))continue;
    var e=null;
    if(lang==='python'){
      e=explainPythonLine(line);
    }else{
      e=explainJavaLine(line);
    }
    if(e)explanations.push(e);
  }
  return explanations;
}

function explainPythonLine(line){
  var dm=line.match(/def\s+(\w+)\s*\(([^)]*)\)\s*:/);
  if(dm){return dm[2].trim()?'定义一个接收参数 '+dm[2].trim()+' 的函数 '+dm[1]:'定义一个无参函数 '+dm[1]}

  var im=line.match(/if\s+(.+?)\s*:/);
  if(im){var c=im[1].trim();return /^\d+$/.test(c)&&c!=='0'?'Python将非零数字 '+c+' 视为True，条件成立':/^\d+$/.test(c)?'0视为False，条件不成立':'当 '+c+' 条件成立时执行'}

  var fm=line.match(/for\s+(\w+)\s+in\s+(.+?)\s*:/);
  if(fm){var it=fm[2].trim();var rm=it.match(/range\s*\(\s*(\d+)\s*\)/);return rm?'循环 '+rm[1]+' 次，'+fm[1]+' 依次取0到'+(parseInt(rm[1])-1):'遍历 '+it+' 中的每个元素赋值给 '+fm[1]}

  var pm=line.match(/print\s*\((.+)\)/);
  if(pm)return '在控制台输出 '+pm[1].trim();

  var retm=line.match(/return\s+(.+)/);
  if(retm)return '返回 '+retm[1].trim()+' 给调用者';

  var am=line.match(/^(\w+)\s*=\s*(.+)$/);
  if(am)return '将 '+am[2].trim()+' 赋值给变量 '+am[1];

  return null;
}

function explainJavaLine(line){
  var jmm=line.match(/(?:public|private|protected)?\s*(?:static\s+)?(?:final\s+)?([\w.<>\[\]]+)\s+(\w+)\s*\(([^)]*)\)/);
  if(jmm){return jmm[3]&&jmm[3].trim()?'定义方法 '+jmm[2]+'，接收参数 '+jmm[3].trim():'定义无参方法 '+jmm[2]}

  var jim=line.match(/if\s*\((.+?)\)/);
  if(jim)return '当 '+jim[1].trim()+' 成立时执行';

  var jfm=line.match(/for\s*\((.+?)\)/);
  if(jfm)return '执行循环：'+jfm[1].trim();

  var jpm=line.match(/System\.out\.print(?:ln)?\s*\((.+)\)/);
  if(jpm)return '在控制台输出 '+jpm[1].trim();

  var jrm=line.match(/return\s+(.+);/);
  if(jrm)return '返回 '+jrm[1].trim();

  var jvm=line.match(/^([\w.<>\[\]]+)\s+(\w+)\s*=\s*(.+);/);
  if(jvm)return '声明 '+jvm[1]+' 类型变量 '+jvm[2]+' 并赋值 '+jvm[3].trim();

  return null;
}

// ==================== 渲染说明书 ====================
function renderTechDoc(parsed,lang){
  var paramsDisplay=parsed.parameters.map(function(p){return p.type+' '+p.name}).join(', ');
  var sig=lang==='java'?parsed.returnType+' '+parsed.methodName+'('+paramsDisplay+')':'def '+parsed.methodName+'('+paramsDisplay+')'+(parsed.returnType&&parsed.returnType!=='void'?' -> '+parsed.returnType:'');
  var stmtEx=generateStatementExplanation(parsed.rawCode,lang);
  var health=calculateHealthScore(parsed.rawCode,parsed.parameters);
  var hhtml='<div class="detail-section"><h4>代码健康度</h4><div style="display:flex;align-items:center;gap:12px"><span style="font-size:28px;font-weight:700;color:'+(health.level==='good'?'var(--success)':health.level==='warn'?'var(--warning)':'var(--error)')+'">'+health.score+'</span><span style="font-size:12px;color:var(--text2)">'+(health.level==='good'?'健康':health.level==='warn'?'一般':'需优化')+'</span></div><div class="health-bar-track"><div class="health-bar-fill '+health.level+'" style="width:'+health.score+'%"></div></div>';
  if(health.deductions.length>0){hhtml+='<div class="health-metrics">';for(var d=0;d<health.deductions.length;d++)hhtml+='<span>'+health.deductions[d].label+': '+health.deductions[d].value+'</span>';hhtml+='</div>'}
  hhtml+='</div>';
  var ehtml='';
  if(stmtEx.length>0){ehtml='<div class="detail-section"><h4>代码说明</h4>';for(var si=0;si<stmtEx.length;si++)ehtml+='<p style="margin-bottom:4px">'+escapeHtml(stmtEx[si])+'</p>';ehtml+='</div>'}
  var html='<div class="detail-section"><h4>函数签名</h4><pre>'+escapeHtml(sig)+'</pre></div>'+hhtml+ehtml;
  html+='<div class="detail-section"><h4>参数列表</h4><table><tr><th>#</th><th>参数名</th><th>类型</th></tr>';
  if(parsed.parameters.length>0)for(var pi=0;pi<parsed.parameters.length;pi++)html+='<tr><td>'+(pi+1)+'</td><td><code>'+escapeHtml(parsed.parameters[pi].name)+'</code></td><td>'+escapeHtml(parsed.parameters[pi].type)+'</td></tr>';
  else html+='<tr><td colspan="3">无参数</td></tr>';
  html+='</table></div>';
  html+='<div class="detail-section"><h4>返回值</h4><p>'+escapeHtml(parsed.returnType||'void')+'</p></div>';
  html+='<div class="detail-section"><h4>依赖</h4><ul>'+(parsed.dependencies.length>0?parsed.dependencies.map(function(d){return'<li>'+escapeHtml(d)+'</li>'}).join(''):'<li>无外部依赖</li>')+'</ul></div>';
  html+='<div class="detail-section"><h4>异常处理</h4><p>'+(parsed.hasTryCatch?'包含 try-catch/except':'未检测到异常处理')+'</p></div>';
  document.getElementById('techDoc').innerHTML=html;
  document.getElementById('techDoc').style.display='block';
  document.getElementById('beginnerDoc').style.display='none';
}

function renderBeginnerDoc(parsed,lang,matchResult){
  var entry=matchResult.entry,name=parsed.methodName,langName=lang==='java'?'Java':'Python',lineCount=parsed.rawCode.split('\n').length;
  var paramDesc=parsed.parameters.length===0?'不需要额外输入':parsed.parameters.map(function(p){return p.name}).join('、');
  var opening='<strong>这个函数就像是在'+escapeHtml(entry.metaphor)+'。</strong>';
  var body=matchResult.matchQuality==='strong'?'当你把'+escapeHtml(entry.inputDesc)+'交给它，它会'+escapeHtml(entry.action)+'。传给它的数据是'+paramDesc+'，最终得到的是'+escapeHtml(entry.outputDesc)+'。':'简单来说，它做的事情就是'+escapeHtml(entry.action)+'。传入'+paramDesc+'，处理后返回结果。';
  var stmtEx=generateStatementExplanation(parsed.rawCode,lang);
  var bs='';if(stmtEx.length>0){bs='具体来说，'+stmtEx.map(function(e){return e.replace(/。$/,'')}).join('；')+'。'}
  var extra='';if(parsed.dependencies.length>0)extra+='它借用了'+parsed.dependencies.length+'个外部工具：'+parsed.dependencies.slice(0,3).map(escapeHtml).join('、')+'。';
  if(parsed.hasTryCatch)extra+='内置了错误防护，出问题不会崩溃。';
  var meta=langName+' 代码片段 &middot; '+lineCount+' 行';
  var html='<div class="narrative-box"><p style="margin-bottom:12px">'+opening+'</p><p style="margin-bottom:12px">'+body+'</p>'+(bs?'<p style="margin-bottom:12px">'+bs+'</p>':'')+(extra?'<p style="margin-bottom:12px;color:var(--text2);font-size:12px">'+extra+'</p>':'')+'</div><p style="margin-top:8px;font-size:11px;color:var(--text2)">'+meta+'</p>';
  document.getElementById('beginnerDoc').innerHTML=html;
  document.getElementById('techDoc').style.display='none';
  document.getElementById('beginnerDoc').style.display='block';
}

// ==================== 事件绑定 ====================
document.getElementById('parseBtn').addEventListener('click',function(){
  var code=document.getElementById('codeInput').value.trim();
  if(!code){showToast('请先粘贴代码');return}
  var lang=document.getElementById('langSelect').value;
  var loading=document.getElementById('loadingIndicator');
  loading.style.display='block';
  var start=performance.now();
  setTimeout(function(){
    try{
      var parsed=lang==='java'?parseJava(code):parsePython(code);
      var match=matchMetaphorEntry(code,parsed);
      var patterns=detectPatterns(parsed,code);
      renderTechDoc(parsed,lang);
      renderBeginnerDoc(parsed,lang,match);
      var duration=Math.round(performance.now()-start);
      recordParse(lang,duration,code,match.firstKeyword,patterns);
      if(typeof Prism!=='undefined')Prism.highlightAll();
    }catch(e){
      document.getElementById('techDoc').innerHTML='<div style="color:var(--error)">代码的意图尚不明朗，请检查输入</div>';
      document.getElementById('beginnerDoc').innerHTML='<div style="color:var(--error)">无法生成解释</div>';
    }finally{loading.style.display='none'}
  },150);
});

document.getElementById('copyTechBtn').addEventListener('click',function(){
  var txt=document.getElementById('techDoc').innerText;
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){showToast('技术版已复制')}).catch(function(){
    var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('技术版已复制');
  });
});

document.getElementById('exportImgBtn').addEventListener('click',function(){
  var doc=document.getElementById('techDoc');
  if(typeof html2canvas==='undefined'){showToast('请稍候再试');return}
  html2canvas(doc,{scale:2,backgroundColor:'#0A0F1A'}).then(function(c){
    var a=document.createElement('a');a.download='code_doc.png';a.href=c.toDataURL();a.click();showToast('卡片已导出');
  }).catch(function(){showToast('导出失败')});
});

document.getElementById('fullStatsBtn').addEventListener('click',openModal);

document.getElementById('logoutBtn').addEventListener('click',function(){
  localStorage.removeItem('codeDocStats');location.reload();
});

document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
    tab.classList.add('active');
    if(tab.dataset.tab==='tech'){document.getElementById('techDoc').style.display='block';document.getElementById('beginnerDoc').style.display='none'}
    else{document.getElementById('techDoc').style.display='none';document.getElementById('beginnerDoc').style.display='block'}
  });
});

document.getElementById('langSelect').addEventListener('change',function(){
  console.log('Switched to '+(this.value==='java'?'Java':'Python'));
});

document.getElementById('codeInput').addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();document.getElementById('parseBtn').click()}
});

loadStats();
if(typeof Prism!=='undefined')Prism.highlightAll();
console.log('代码解释器 v3.0 已启动');
</script>
</body>
</html>
