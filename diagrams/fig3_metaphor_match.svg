<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 900" width="750" height="900">
<style>
  text { font-family: "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; }
  .title { font-size:15px; font-weight:700; fill:#1E293B; }
  .subtitle { font-size:11px; fill:#64748B; }
  .box { fill:#FFFFFF; stroke:#CBD5E1; stroke-width:1.2; rx:6; }
  .box-accent { fill:#EFF6FF; stroke:#93C5FD; stroke-width:1.2; rx:6; }
  .layer-label { font-size:13px; font-weight:700; fill:#1E40AF; }
  .module-name { font-size:11px; font-weight:600; fill:#0F172A; }
  .module-desc { font-size:9px; fill:#64748B; }
  .badge { font-size:10px; font-weight:600; }
  .arrow { stroke:#94A3B8; stroke-width:1.5; fill:none; marker-end:url(#arrowhead); }
  .arrow-thin { stroke:#CBD5E1; stroke-width:1; fill:none; }
  .dashed { stroke-dasharray: 4 3; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
  </marker>
</defs>
<rect width="750" height="900" fill="#F8FAFC" rx="4"/>
<text x="375" y="22" class="title" text-anchor="middle">比喻匹配加权评分算法流程图</text><rect x="275" y="45" width="200" height="36" class="box-accent"/><text x="375.0" y="59" class="module-name" text-anchor="middle">输入: code, parsed, patterns</text><rect x="275" y="105" width="200" height="36" class="box"/><text x="375.0" y="119" class="module-name" text-anchor="middle">初始化 bestScore=0, bestEntry=null</text><rect x="275" y="165" width="200" height="36" class="box"/><text x="375.0" y="179" class="module-name" text-anchor="middle">for each in METAPHOR_LIBRARY (38条)</text><rect x="215" y="230" width="320" height="50" class="box"/><text x="375.0" y="244" class="module-name" text-anchor="middle">Step 1: 函数名匹配</text><text x="375.0" y="260" class="module-name" text-anchor="middle">关键词∈函数名→+8  概念词∈函数名→+6</text><rect x="215" y="305" width="320" height="50" class="box"/><text x="375.0" y="319" class="module-name" text-anchor="middle">Step 2: 代码体匹配</text><text x="375.0" y="335" class="module-name" text-anchor="middle">泛型词(if/for/return)→+1  领域词(sort/cache/api)→+3</text><rect x="215" y="380" width="320" height="50" class="box"/><text x="375.0" y="394" class="module-name" text-anchor="middle">Step 3: 模式交叉验证</text><text x="375.0" y="410" class="module-name" text-anchor="middle">概念词 ∩ 检测模式? → +7</text><polygon points="375.0,460 475,478.0 375.0,496 275,478.0" class="box" stroke="#F59E0B" stroke-width="1.5"/><text x="375.0" y="482.0" class="module-name" text-anchor="middle">score > bestScore?</text><rect x="450" y="525" width="180" height="28" class="box-accent"/><text x="540.0" y="539" class="module-name" text-anchor="middle">YES → 更新 best</text><rect x="95" y="525" width="140" height="28" class="box-accent"/><text x="165.0" y="539" class="module-name" text-anchor="middle">NO → 继续下一条</text><rect x="275" y="590" width="200" height="40" class="box"/><text x="375.0" y="604" class="module-name" text-anchor="middle">判定匹配质量:</text><text x="375.0" y="620" class="module-name" text-anchor="middle">≥8→strong  ≥1→moderate  0→fallback</text><rect x="275" y="660" width="200" height="36" class="box-accent"/><text x="375.0" y="674" class="module-name" text-anchor="middle">输出: { entry, matchQuality,</text><text x="375.0" y="690" class="module-name" text-anchor="middle">  firstKeyword, inferReason }</text><line x1="375" y1="81" x2="375" y2="105" class="arrow"/><line x1="375" y1="141" x2="375" y2="165" class="arrow"/><line x1="375" y1="201" x2="375" y2="230" class="arrow"/><line x1="375" y1="280" x2="375" y2="305" class="arrow"/><line x1="375" y1="355" x2="375" y2="380" class="arrow"/><line x1="375" y1="430" x2="375" y2="460" class="arrow"/><line x1="375" y1="496" x2="375" y2="590" class="arrow"/><line x1="375" y1="630" x2="375" y2="660" class="arrow"/><line x1="275" y1="478" x2="165" y2="525" class="arrow-thin"/><line x1="475" y1="478" x2="540" y2="525" class="arrow-thin"/><line x1="165" y1="553" x2="165" y2="183" class="arrow-thin dashed"/><line x1="165" y1="183" x2="275" y2="183" class="arrow-thin dashed"/><line x1="540" y1="553" x2="540" y2="608" class="arrow-thin"/><line x1="540" y1="608" x2="375" y2="608" class="arrow-thin"/><rect x="550" y="720" width="170" height="80" class="box"/><text x="635" y="740" class="module-name" text-anchor="middle">权重设计原则</text><text x="635" y="760" class="module-desc" text-anchor="middle">函数名 > 概念词 > 模式</text><text x="635" y="775" class="module-desc" text-anchor="middle">> 领域词 > 泛型词</text><text x="635" y="792" class="module-desc" text-anchor="middle">泛型词降权防止噪声</text></svg>