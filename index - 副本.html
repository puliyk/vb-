<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码片段智能说明书生成器</title>

<link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">

<style>
/* ===========================================================
   样式表 — 深色主题，Grid 双栏，响应式，推论视觉区分
   =========================================================== */

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --accent: #7c5ce7;
  --accent2: #a78bfa;
  --accent-glow: rgba(124,92,231,0.25);
  --java: #f59e0b;
  --python: #3b82f6;
  --success: #3fb950;
  --error: #f85149;
  --warning: #d2991d;
  --radius: 12px;
  --inferred-bg: rgba(210,153,29,0.08);
  --inferred-border: rgba(210,153,29,0.3);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ========== 顶部栏 ========== */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.header-title {
  font-size: 1.2rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent2), #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.02em;
}

.header-right { display: flex; align-items: center; gap: 12px; }
.lang-label { font-size: 0.85rem; color: var(--text2); }

.lang-select {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 0.95rem;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.lang-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

/* ========== 主体双栏布局 ========== */
.main-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  padding: 24px;
  max-width: 1480px;
  margin: 0 auto;
  min-height: calc(100vh - 170px);
}

@media (max-width: 768px) {
  .main-container { grid-template-columns: 1fr; }
}

/* ========== 左栏：输入区 ========== */
.input-panel { display: flex; flex-direction: column; gap: 14px; }

.code-textarea {
  flex: 1;
  min-height: 420px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  font-family: 'Fira Code', 'Cascadia Code', 'Consolas', 'Menlo', monospace;
  font-size: 0.88rem;
  line-height: 1.7;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  tab-size: 4;
}
.code-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.code-textarea::placeholder { color: var(--text2); opacity: 0.7; }

/* ========== 按钮 ========== */
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.35); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #8b6cee; }

.btn-outline {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-outline:hover { border-color: var(--accent2); color: var(--accent2); }

/* ========== 加载动画 ========== */
.loading-overlay {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  color: var(--accent2);
  font-size: 0.92rem;
}
.loading-overlay.active { display: flex; }

.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ========== 错误提示 ========== */
.error-toast {
  display: none;
  background: rgba(248,81,73,0.12);
  border: 1px solid rgba(248,81,73,0.35);
  color: #ffa198;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 0.88rem;
}
.error-toast.active { display: block; }

/* ========== 右栏：说明书展示区 ========== */
.output-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 500px;
}

.tab-row { display: flex; border-bottom: 1px solid var(--border); }

.tab-btn {
  flex: 1;
  padding: 13px 18px;
  background: transparent;
  color: var(--text2);
  border: none;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: color 0.2s, background 0.2s;
  position: relative;
  font-family: inherit;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent2); background: rgba(124,92,231,0.06); }
.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0; left: 12px; right: 12px;
  height: 2px;
  background: var(--accent);
  border-radius: 1px 1px 0 0;
}

.tab-content {
  display: none;
  flex: 1;
  padding: 22px;
  overflow-y: auto;
}
.tab-content.active { display: block; }

/* 空状态 */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text2);
  text-align: center;
  gap: 10px;
  padding: 40px;
}
.empty-state-icon { font-size: 3.5rem; opacity: 0.25; }

/* ========== 说明书内容 ========== */
.spec-section { margin-bottom: 22px; }
.spec-section:last-child { margin-bottom: 0; }

.spec-label {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent2);
  margin-bottom: 10px;
}

.spec-signature {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 15px 20px;
  font-family: 'Fira Code', 'Consolas', 'Menlo', monospace;
  font-size: 0.9rem;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.6;
}

.spec-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.spec-table th, .spec-table td {
  text-align: left;
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
}
.spec-table th {
  color: var(--text2);
  font-weight: 600;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ========== 推论视觉区分 ========== */
.inferred {
  font-style: italic;
  border-bottom: 1px dashed var(--warning);
  cursor: help;
  background: var(--inferred-bg);
  padding: 1px 4px;
  border-radius: 3px;
  position: relative;
}
.inferred:hover::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface2);
  color: var(--warning);
  border: 1px solid var(--inferred-border);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-style: normal;
  font-weight: 400;
  white-space: nowrap;
  z-index: 10;
  pointer-events: none;
}

.inferred-block {
  border-left: 2px dashed var(--inferred-border);
  padding-left: 12px;
  margin: 8px 0;
  background: var(--inferred-bg);
  border-radius: 0 6px 6px 0;
}
.inferred-block .inferred-label {
  font-size: 0.7rem;
  color: var(--warning);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}

/* ========== 结构化参数列表（非表格） ========== */
.param-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.param-item {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 8px 14px;
  background: var(--surface2);
  border-radius: 6px;
  border: 1px solid var(--border);
  font-size: 0.9rem;
}
.param-name {
  font-family: 'Fira Code', 'Consolas', 'Menlo', monospace;
  color: var(--accent2);
  font-weight: 600;
  min-width: 80px;
}
.param-type {
  color: var(--text2);
  font-size: 0.85rem;
}
.param-type.fact { color: var(--text); }
.param-sep {
  color: var(--border);
  margin: 0 2px;
}

/* ========== 洞察模块（单行） ========== */
.insight-line {
  font-size: 0.85rem;
  color: var(--text2);
  font-style: italic;
  line-height: 1.6;
  padding: 6px 0;
  border-left: 2px solid var(--accent);
  padding-left: 12px;
}

/* ========== 小白版叙事体（编辑部按语风格） ========== */
.narrative-block {
  background: rgba(124,92,231,0.04);
  border-left: 4px solid var(--accent);
  border-radius: 0 8px 8px 0;
  padding: 22px 24px;
  font-size: 0.95rem;
  line-height: 2.1;
  color: var(--text);
  letter-spacing: 0.01em;
  position: relative;
}
.narrative-block::before {
  content: '';
  position: absolute;
  top: 0; left: -4px;
  width: 4px; height: 100%;
  background: linear-gradient(180deg, var(--accent), var(--accent2));
  border-radius: 2px;
  opacity: 0.6;
}
.narrative-block .narrative-opening {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--accent2);
  display: block;
  margin-bottom: 10px;
}
.narrative-block .narrative-highlight {
  color: var(--accent2);
  font-weight: 600;
}
.narrative-block .narrative-func-name {
  font-family: 'Fira Code', 'Consolas', 'Menlo', monospace;
  color: #fff;
  font-weight: 600;
  background: rgba(255,255,255,0.06);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 0.9em;
}

.narrative-extra {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: 0.85rem;
  color: var(--text2);
  line-height: 1.8;
}

/* ========== 徽章 ========== */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 0.78rem;
  font-weight: 600;
}
.badge-java { background: rgba(245,158,11,0.15); color: var(--java); }
.badge-python { background: rgba(59,130,246,0.15); color: var(--python); }
.badge-try { background: rgba(63,185,80,0.15); color: var(--success); }
.badge-no-try { background: rgba(248,81,73,0.12); color: var(--error); }

.dep-list {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.dep-list li {
  background: var(--surface2);
  padding: 4px 12px;
  border-radius: 6px;
  font-family: 'Fira Code', 'Consolas', monospace;
  font-size: 0.83rem;
  border: 1px solid var(--border);
}

/* ========== 底部 ========== */
.footer {
  text-align: center;
  padding: 16px;
  color: var(--text2);
  font-size: 0.78rem;
  border-top: 1px solid var(--border);
}

/* ========== Toast ========== */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--success);
  color: #fff;
  padding: 10px 24px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.88rem;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ===== 顶部栏 ===== -->
<header class="header">
  <span class="header-title">代码片段智能说明书生成器</span>
  <div class="header-right">
    <span class="lang-label">语言：</span>
    <select class="lang-select" id="langSelect">
      <option value="java">Java</option>
      <option value="python">Python</option>
    </select>
  </div>
</header>

<!-- ===== 主体 ===== -->
<div class="main-container">

  <!-- 左栏：输入 -->
  <div class="input-panel">
    <textarea
      class="code-textarea"
      id="codeInput"
      placeholder="在此粘贴 Java 或 Python 函数代码…&#10;&#10;示例（Java）：&#10;public int add(int a, int b) {&#10;    return a + b;&#10;}&#10;&#10;示例（Python）：&#10;def quick_sort(arr):&#10;    if len(arr) &lt;= 1:&#10;        return arr&#10;    pivot = arr[0]&#10;    left = [x for x in arr[1:] if x &lt; pivot]&#10;    right = [x for x in arr[1:] if x &gt;= pivot]&#10;    return quick_sort(left) + [pivot] + quick_sort(right)"
      spellcheck="false"
    ></textarea>

    <div class="error-toast" id="errorToast"></div>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <span>正在解析代码…</span>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="parseBtn">生成说明书</button>
      <button class="btn btn-outline" id="copyTechBtn">复制技术版</button>
      <button class="btn btn-outline" id="copyBeginnerBtn">复制小白版</button>
      <button class="btn btn-outline" id="exportBtn">导出分享卡片</button>
    </div>
  </div>

  <!-- 右栏：说明书 -->
  <div class="output-panel" id="outputPanel">
    <div class="tab-row">
      <button class="tab-btn active" data-tab="tech">技术版说明书</button>
      <button class="tab-btn" data-tab="beginner">小白版说明书</button>
    </div>

    <div class="tab-content active" id="techTab">
      <div class="empty-state" id="techEmpty">
        <div class="empty-state-icon">&lt;/&gt;</div>
        <p>代码的意图尚不明朗</p>
        <p style="font-size:0.8rem;color:var(--text2)">粘贴一段代码，让我们揭开它的面纱</p>
      </div>
      <div id="techContent" style="display:none"></div>
    </div>

    <div class="tab-content" id="beginnerTab">
      <div class="empty-state" id="beginnerEmpty">
        <div class="empty-state-icon">&mdash;</div>
        <p>解析后将在此显示小白版说明书</p>
        <p style="font-size:0.8rem">用大白话讲故事的方式解释代码</p>
      </div>
      <div id="beginnerContent" style="display:none"></div>
    </div>
  </div>

</div>

<!-- ===== 底部 ===== -->
<footer class="footer">
  庞凯匀 &middot; 230152061 &middot; 代码片段智能说明书生成器 &middot; 纯前端本地解析，不上传任何代码
</footer>

<!-- toast -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
<!-- html2canvas -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
/* ==================================================================
   代码片段智能说明书生成器 — 核心引擎
   科学家的严谨 x 哲学家的深刻 x 科普作家的叙事力
   所有解析在浏览器本地完成
   ================================================================== */

/* ==================== 比喻库 (38条 - 概念域映射) ==================== */
const METAPHOR_LIBRARY = [
  { keywords: ['sort','排序','sorted','orderby'],
    concept: '排序', metaphor: '整理一叠乱序的扑克牌', action: '把杂乱无章的东西按照一定的规则排列整齐', inputDesc: '乱序的数据集合', outputDesc: '排好顺序的数据' },
  { keywords: ['filter','过滤','where','筛选'],
    concept: '过滤', metaphor: '用筛子筛面粉', action: '把符合要求的东西留下来，不符合的挡在外面', inputDesc: '混合着粗细颗粒的数据', outputDesc: '只含符合要求的部分' },
  { keywords: ['map','映射','transform','转换','apply'],
    concept: '映射', metaphor: '给一篮苹果逐个贴上标签变成新的果篮', action: '对每一个元素进行相同的变换操作', inputDesc: '原始数据集合', outputDesc: '每个元素经过变换后的新集合' },
  { keywords: ['reduce','聚合','fold','accumulate','sum'],
    concept: '聚合', metaphor: '把一把零钱换成一张大钞', action: '将分散的多项数据合并浓缩为一个结果', inputDesc: '多项分散的数据', outputDesc: '一个综合的结果' },
  { keywords: ['recursion','recursive','递归'],
    concept: '递归', metaphor: '一层层打开俄罗斯套娃直到最小的那个', action: '把大问题层层分解为同类的小问题，到底后再逐层返回答案', inputDesc: '一个复杂的问题', outputDesc: '分解到最底层后汇总出的答案' },
  { keywords: ['read','读取','readfile','open'],
    concept: '读取', metaphor: '打开冰箱门拿出食物', action: '从外部获取需要的信息而无需了解底层原理', inputDesc: '一个文件路径或数据源地址', outputDesc: '文件中的内容' },
  { keywords: ['write','写入','writefile','save','保存'],
    concept: '写入', metaphor: '在日记本上记录当天的想法', action: '把处理好的信息一笔一划地存到指定位置', inputDesc: '要保存的数据和目标位置', outputDesc: '持久化保存的确认' },
  { keywords: ['search','查找','find','搜索','indexof','contains'],
    concept: '查找', metaphor: '在图书馆里按编号找书', action: '从一大堆数据中快速定位你要的那个目标', inputDesc: '要查找的目标和搜索范围', outputDesc: '目标数据的位置或内容' },
  { keywords: ['loop','循环','for','while','foreach','遍历','iterate'],
    concept: '循环', metaphor: '流水线上的工人逐一检查每个零件', action: '对一组数据中的每一个元素，不厌其烦地重复相同的操作', inputDesc: '一组数据', outputDesc: '每个元素都经过处理后的结果' },
  { keywords: ['if','else','条件','判断','switch','分支'],
    concept: '条件判断', metaphor: '站在岔路口看路标选方向', action: '根据不同的情况选择不同的处理方式', inputDesc: '一个需要判断的条件', outputDesc: '根据条件走不同分支后的结果' },
  { keywords: ['function','方法','函数','def'],
    concept: '函数', metaphor: '看菜谱做菜', action: '按照写好的步骤接受原材料做出成品', inputDesc: '原材料（参数）', outputDesc: '做好的菜（返回值）' },
  { keywords: ['class','类','对象','object','new'],
    concept: '类', metaphor: '按照设计蓝图造车', action: '作为模板定义属性和行为，用它可以创建出一个个具体的实例', inputDesc: '一个类的定义', outputDesc: '按蓝图创建的对象实例' },
  { keywords: ['array','list','数组','列表','集合'],
    concept: '列表', metaphor: '一张可以涂改的购物清单', action: '把要处理的东西一行行列出来，方便随时增减', inputDesc: '零散的数据项', outputDesc: '组织好的数据列表' },
  { keywords: ['dictionary','dict','map','hashmap','字典','键值'],
    concept: '字典', metaphor: '一本可以快速翻查的通讯录', action: '给每个值配一个唯一的名字，想查什么直接按名字找', inputDesc: '键值对数据', outputDesc: '按名查到的对应值' },
  { keywords: ['try','catch','except','异常','错误处理','exception'],

/* ==================== 工具函数 ==================== */

function splitParams(str) {
  const parts = [];
  let depth = 0, current = '';
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (ch === ',' && depth === 0) { parts.push(current); current = ''; }
    else {
      if ('<([{'.indexOf(ch) !== -1) depth++;
      if ('>)]}'.indexOf(ch) !== -1) depth--;
      current += ch;
    }
  }
  const t = current.trim();
  if (t) parts.push(t);
  return parts;
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function inferredSpan(text, tooltip) {
  return '<span class="inferred" data-tooltip="' + escapeHtml(tooltip || 'AI推断') + '">' + escapeHtml(text) + '</span>';
}

/* ==================== 解析引擎 ==================== */

function inferReturnType(code, isMethodMatched) {
  if (/return\s+["'`]/.test(code)) return { value: 'String', isInferred: false, reason: '' };
  if (/return\s+(true|false)\b/.test(code)) return { value: 'boolean', isInferred: false, reason: '' };
  if (/return\s+\d+(\.\d+)?/.test(code)) return { value: 'int', isInferred: false, reason: '' };
  if (/return\s+new\s+(\w+)/.test(code)) {
    const m = code.match(/return\s+new\s+(\w+)/);
    return { value: m ? m[1] : 'Object', isInferred: false, reason: '' };
  }
  if (/return\s+\w+\s*\(/.test(code)) {
    const m = code.match(/return\s+(\w+)\s*\(/);
    return { value: m ? '调用 ' + m[1] + '() 的结果' : '推断返回值', isInferred: true, reason: 'AI推断：基于return语句调用的函数名' };
  }
  if (/return\s+\w+/.test(code)) {
    const m = code.match(/return\s+(\w+)/);
    return { value: m ? '变量: ' + m[1] : '推断返回值', isInferred: true, reason: 'AI推断：基于return后跟随的变量名' };
  }
  if (!/return/.test(code)) {
    return { value: 'void', isInferred: isMethodMatched ? false : true, reason: isMethodMatched ? '' : 'AI推断：代码中未发现return语句，推测为无返回值' };
  }
  return { value: '推断返回值', isInferred: true, reason: 'AI推断：无法精确判定返回类型' };
}

function inferFunctionName(code, lang) {
  const cmt = code.match(/(?:\/\/|#)\s*(.+)/);
  if (cmt) return { value: cmt[1].trim().substring(0, 40), isInferred: true, reason: 'AI推断：基于代码注释内容' };

  const cl = code.toLowerCase();
  if (/sort|sorted/.test(cl)) return { value: '排序函数', isInferred: true, reason: 'AI推断：基于代码中检测到的排序关键词' };
  if (/filter|筛选/.test(cl)) return { value: '过滤函数', isInferred: true, reason: 'AI推断：基于代码中检测到的过滤关键词' };
  if (/search|find|查找/.test(cl)) return { value: '查找函数', isInferred: true, reason: 'AI推断：基于代码中检测到的搜索关键词' };
  if (/validate|check|验证/.test(cl)) return { value: '校验函数', isInferred: true, reason: 'AI推断：基于代码中检测到的验证关键词' };
  if (/parse|解析/.test(cl)) return { value: '解析函数', isInferred: true, reason: 'AI推断：基于代码中检测到的解析关键词' };
  if (/calc|sum|avg|计算/.test(cl)) return { value: '计算函数', isInferred: true, reason: 'AI推断：基于代码中检测到的计算关键词' };
  if (/read|读取|load|加载/.test(cl)) return { value: '读取函数', isInferred: true, reason: 'AI推断：基于代码中检测到的读取关键词' };
  if (/write|save|保存|写入/.test(cl)) return { value: '写入函数', isInferred: true, reason: 'AI推断：基于代码中检测到的写入关键词' };
  if (/convert|transform|转换/.test(cl)) return { value: '转换函数', isInferred: true, reason: 'AI推断：基于代码中检测到的转换关键词' };
  if (/print|log|输出|显示/.test(cl)) return { value: '输出函数', isInferred: true, reason: 'AI推断：基于代码中检测到的输出关键词' };
  if (/=>/.test(code) || /lambda/.test(cl)) return { value: '匿名函数(lambda)', isInferred: true, reason: 'AI推断：检测到箭头函数或lambda表达式' };

  return { value: lang === 'java' ? '未命名方法' : '未命名函数', isInferred: true, reason: 'AI推断：无法从代码特征中判定函数用途' };
}

function parseJavaParams(paramsStr) {
  if (!paramsStr) return [];
  return splitParams(paramsStr).map(function(part) {
    const parts = part.trim().split(/\s+/);
    const name = parts.pop() || '';
    const type = parts.join(' ') || 'Object';
    return { name: name, type: type, typeInferred: false, typeInferReason: '' };
  });
}

function parsePythonParams(paramsStr) {
  if (!paramsStr) return [];
  return splitParams(paramsStr)
    .filter(function(p) {
      const n = p.trim().split(/\s*[:=]/)[0].trim();
      return n !== 'self' && n !== 'cls';
    })
    .map(function(part) {
      const trimmed = part.trim();
      let name = trimmed;
      let type = 'Any';
      let typeInferred = true;
      let typeInferReason = '';

      const eqIdx = trimmed.indexOf('=');
      const beforeDefault = eqIdx >= 0 ? trimmed.substring(0, eqIdx).trim() : trimmed;

      const colonIdx = beforeDefault.indexOf(':');
      if (colonIdx >= 0) {
        name = beforeDefault.substring(0, colonIdx).trim();
        type = beforeDefault.substring(colonIdx + 1).trim();
        typeInferred = false;
        typeInferReason = '';
      } else {
        name = beforeDefault;
        const nl = name.toLowerCase();
        if (/num|count|size|len|index|amount|total|sum|age|year/.test(nl)) { type = 'int'; typeInferReason = 'AI推断：基于参数名中的数量语义'; }
        else if (/name|label|msg|message|title|text|desc|str/.test(nl)) { type = 'str'; typeInferReason = 'AI推断：基于参数名中的文本语义'; }
        else if (/arr|list|data|items|collection|elements/.test(nl)) { type = 'list'; typeInferReason = 'AI推断：基于参数名中的集合语义'; }
        else if (/flag|bool|is_|enabled/.test(nl)) { type = 'bool'; typeInferReason = 'AI推断：基于参数名中的布尔语义'; }
        else if (/file|path|url|dir/.test(nl)) { type = 'str'; typeInferReason = 'AI推断：基于参数名中的路径语义'; }
        else if (/obj|object|config|options|settings/.test(nl)) { type = 'dict'; typeInferReason = 'AI推断：基于参数名中的对象语义'; }
        else { typeInferReason = 'AI推断：无类型注解且无法从参数名判定'; }
      }

      return { name: name, type: type, typeInferred: typeInferred, typeInferReason: typeInferReason };
    });
}

function parseJava(code) {
  const result = {
    methodName: '', methodNameInferred: false, methodNameInferReason: '',
    parameters: [],
    returnType: '', returnTypeInferred: false, returnTypeInferReason: '',
    dependencies: [], hasTryCatch: false,
    rawCode: code.trim()
  };

  const importRe = /import\s+([\w.]+(?:\s*\.\s*\*)?)\s*;/g;
  let m;
  while ((m = importRe.exec(code)) !== null) { result.dependencies.push(m[1]); }

  result.hasTryCatch = /try\s*\{/.test(code);

  const methodRe = /(?:(?:public|private|protected)\s+)?(?:static\s+)?(?:final\s+)?(?:synchronized\s+)?([\w.]+(?:<[^>]*>)?(?:\[\])?)\s+(\w+)\s*\(([^)]*)\)/;
  const mm = code.match(methodRe);

  if (mm) {
    result.returnType = mm[1]; result.returnTypeInferred = false; result.returnTypeInferReason = '';
    result.methodName = mm[2]; result.methodNameInferred = false; result.methodNameInferReason = '';
    result.parameters = parseJavaParams(mm[3].trim());
  } else {
    const rt = inferReturnType(code, false);
    result.returnType = rt.value; result.returnTypeInferred = rt.isInferred; result.returnTypeInferReason = rt.reason;
    const nameInfo = inferFunctionName(code, 'java');
    result.methodName = nameInfo.value; result.methodNameInferred = nameInfo.isInferred; result.methodNameInferReason = nameInfo.reason;
    result.parameters = inferParamsFromCode(code);
  }

  return result;
}

function parsePython(code) {
  const result = {
    methodName: '', methodNameInferred: false, methodNameInferReason: '',
    parameters: [],
    returnType: '', returnTypeInferred: false, returnTypeInferReason: '',
    dependencies: [], hasTryCatch: false,
    rawCode: code.trim()
  };

  const importRe = /^(?:import|from)\s+([\w.]+)/gm;
  let m;
  while ((m = importRe.exec(code)) !== null) { result.dependencies.push(m[1]); }

  result.hasTryCatch = /try\s*:/i.test(code);

  const defRe = /def\s+(\w+)\s*\(([^)]*)\)\s*(?:->\s*(\w+))?\s*:/;
  const dm = code.match(defRe);

  if (dm) {
    result.methodName = dm[1]; result.methodNameInferred = false; result.methodNameInferReason = '';
    if (dm[3]) {
      result.returnType = dm[3]; result.returnTypeInferred = false; result.returnTypeInferReason = '';
    } else {
      const rt = inferReturnType(code, true);
      result.returnType = rt.value; result.returnTypeInferred = rt.isInferred; result.returnTypeInferReason = rt.reason;
    }
    result.parameters = parsePythonParams(dm[2].trim());
  } else {
    const rt = inferReturnType(code, false);
    result.returnType = rt.value; result.returnTypeInferred = rt.isInferred; result.returnTypeInferReason = rt.reason;
    const nameInfo = inferFunctionName(code, 'python');
    result.methodName = nameInfo.value; result.methodNameInferred = nameInfo.isInferred; result.methodNameInferReason = nameInfo.reason;
    result.parameters = inferParamsFromCode(code);
  }

  return result;
}

function inferParamsFromCode(code) {
  const params = [];
  const varRe = /\b([a-zA-Z_]\w*)\s*=/g;
  const seen = new Set();
  const reserved = new Set([
    'if','else','for','while','return','var','let','const','new',
    'int','String','boolean','void','def','import','from','class',
    'public','private','protected','static','final','throws','None','True','False'
  ]);
  let m;
  while ((m = varRe.exec(code)) !== null) {
    const n = m[1];
    if (!seen.has(n) && !reserved.has(n)) {
      seen.add(n);
      if (params.length < 5) {
        params.push({ name: n, type: '推断参数', typeInferred: true, typeInferReason: 'AI推断：基于代码中变量赋值语句' });
      }
    }
  }
  return params;
}

/* ==================== 代码洞察引擎 ==================== */

function generateInsight(parsed, code) {
  const cl = code.toLowerCase();
  const insights = [];
  const funcName = parsed.methodName.toLowerCase();
  const selfCall = new RegExp(funcName + '\\s*\\(', 'i');

  if (selfCall.test(code)) {
    insights.push('此函数采用递归（分治）策略，将复杂问题逐层分解为规模更小的同类子问题，以栈空间换取代码的简洁性和可读性。');
  }
  if (/sort|sorted/.test(cl) || /pivot|partition/.test(cl)) {
    insights.push('此函数实现了排序逻辑，通过比较和交换（或分区）将数据重排为有序序列，时间复杂度预计在 O(n log n) 到 O(n squared) 之间。');
  }
  if (/cache|memo|memoize|缓存/.test(cl)) {
    insights.push('此函数采用了缓存（Memoization）策略，以空间换时间，将已计算的结果暂存，避免重复运算，尤其适用于存在大量重复子问题的场景。');
  }
  if (parsed.hasTryCatch) {
    insights.push('此函数包含防御性编程思维——通过 try-catch/except 对边界条件和异常路径进行容错处理，保证程序在非理想输入下不会崩溃。');
  }
  if (/yield|iterator|stream|lazy/.test(cl)) {
    insights.push('此函数采用惰性求值（Lazy Evaluation）策略，数据按需生成而非一次性加载，适合处理大规模或无限序列场景。');
  }
  if (/factory|create|build|new\s+\w+/.test(cl) && /return\s+new/.test(code)) {
    insights.push('此函数封装了对象创建逻辑（类似工厂模式），将创建决策与创建细节分离，降低了调用方与具体实现类的耦合。');
  }
  if (/validate|check|验证|校验|assert/.test(cl)) {
    insights.push('此函数作为数据边界的守门人，在数据进入核心逻辑之前进行预校验，遵循 Fail Fast 原则，避免脏数据污染后续流程。');
  }
  if (/read|write|open|file|io|http|fetch|request/.test(cl)) {
    insights.push('此函数涉及 I/O 操作（文件或网络），属于系统中与外部世界交互的边界层，其性能和可靠性往往取决于外部资源的响应。');
  }
  if (/convert|transform|parse|serialize|deserialize|format/.test(cl)) {
    insights.push('此函数充当数据格式的翻译官，在两种数据表示之间进行转换，通常位于系统边界或模块衔接处，是降低耦合的关键胶水代码。');
  }

  if (insights.length === 0) {
    if (parsed.dependencies.length > 0) {
      insights.push('此函数依赖外部模块协同工作，体现了模块化设计原则——各模块各司其职，通过组合而非堆砌来实现复杂功能。');
    } else if (parsed.parameters.length === 0) {
      insights.push('此函数为无参函数，可能依赖内部状态或全局上下文，设计上偏向命令（Command）而非查询（Query），关注其副作用。');
    } else {
      insights.push('此函数接收输入并产生输出，是一个典型的数据变换单元，适合作为管道（Pipeline）中的一个环节组合使用。');
    }
  }

  return insights.join(' ');
}

/**
 * 匹配概念域映射条目
 * 使用加权信号系统，返回完整的叙事框架条目
 */
function matchMetaphorEntry(code, parsed) {
  const cl = (parsed.methodName + ' ' + code).toLowerCase();
  let bestScore = 0;
  let bestEntry = null;

  const contextSignals = [
    { keys: ['recursion','recursive','递归'], weight: 3 },
    { keys: ['sort','sorted','排序','pivot','partition'], weight: 3 },
    { keys: ['cache','memo','缓存','记忆','memoize'], weight: 3 },
    { keys: ['try','catch','except','finally','throw','throws','raise'], weight: 2 },
    { keys: ['factory','create','build','construct'], weight: 2 },
    { keys: ['encrypt','decrypt','hash','加密','解密'], weight: 3 },
    { keys: ['async','await','promise','then','callback'], weight: 2 },
    { keys: ['filter','where','筛选','过滤'], weight: 2 },
    { keys: ['map','transform','映射','转换','apply'], weight: 2 },
    { keys: ['read','write','open','file','load','save'], weight: 2 },
    { keys: ['validate','check','assert','验证','校验'], weight: 2 }
  ];

  for (let i = 0; i < METAPHOR_LIBRARY.length; i++) {
    const entry = METAPHOR_LIBRARY[i];
    let score = 0;

    for (let j = 0; j < entry.keywords.length; j++) {
      const kw = entry.keywords[j].toLowerCase();
      if (cl.indexOf(kw) !== -1) {
        score += 1;
        for (let s = 0; s < contextSignals.length; s++) {
          if (contextSignals[s].keys.indexOf(kw) !== -1) {
            score += contextSignals[s].weight;
          }
        }
      }
    }

    if (score > bestScore) {
      bestScore = score;
      bestEntry = entry;
    }
  }

  return {
    entry: bestEntry || DEFAULT_METAPHOR_ENTRY,
    matchQuality: bestScore > 0 ? (bestScore >= 5 ? 'strong' : 'moderate') : 'fallback'
  };
}

/* ==================== 小白版叙事体生成器 ==================== */

/**
 * generateNarrativeBeginnerDoc — 科普作家上线
 * 彻底废除点罗列，将解析结果与概念域映射融合为一段流畅的散文
 * 输出格式：首句加粗主题色引出比喻核心 → 自然过渡到输入输出和场景
 */
function generateNarrativeBeginnerDoc(parsed, lang, matchResult) {
  const entry = matchResult.entry;
  const name = parsed.methodName;
  const langName = lang === 'java' ? 'Java' : 'Python';
  const lineCount = parsed.rawCode.split('\n').length;

  // ---- 构建参数的口语化描述 ----
  let paramDesc = '';
  if (parsed.parameters.length === 0) {
    paramDesc = '不需要额外给它什么东西，它自己知道从哪里获取信息';
  } else {
    const descs = parsed.parameters.map(function(p) {
      const nl = p.name.toLowerCase();
      if (/num|count|size|len|index|amount|total|sum|age|year|score/.test(nl)) return '一个数字（' + p.name + '）';
      if (/name|label|msg|message|title|text|desc|str|key|word/.test(nl)) return '一段文字（' + p.name + '）';
      if (/arr|list|array|data|items|collection|elements/.test(nl)) return '一组数据（' + p.name + '）';
      if (/flag|bool|is|enabled/.test(nl)) return '一个"是或否"的选择（' + p.name + '）';
      if (/file|path|url|dir/.test(nl)) return '一个文件路径或网址（' + p.name + '）';
      if (/obj|object|config|options|settings/.test(nl)) return '一份配置说明（' + p.name + '）';
      return p.name;
    });
    paramDesc = '你需要交给它 ' + descs.join('、');
  }

  // ---- 构建返回值描述 ----
  let outputDesc = '';
  const rt = (parsed.returnType || '').toLowerCase();
  if (rt === 'void' || rt === 'none' || !rt) {
    outputDesc = '它不会返回一个具体数值，而是直接产生效果——比如修改了数据、打印了结果或者保存了文件';
  } else if (/int|float|double|num|number|long|short/.test(rt)) {
    outputDesc = '它会返回一个数字给你，这就是你要的计算结果';
  } else if (/string|str/.test(rt)) {
    outputDesc = '它会返回一段文字给你';
  } else if (/bool|boolean/.test(rt)) {
    outputDesc = '它会告诉你是"对"还是"错"（true 或 false），帮你做出下一步判断';
  } else if (/list|array|\[\]|集合/.test(rt)) {
    outputDesc = '它会返回一组排列整齐的数据给你';
  } else if (/map|dict|dictionary/.test(rt)) {
    outputDesc = '它会返回一个对照表给你——你可以像查字典一样用键来查对应的值';
  } else {
    outputDesc = '它会返回处理后的结果给你';
  }

  // ---- 组装散文 ----
  // 首句：用加粗主题色引出比喻核心
  let opening = '<span class="narrative-opening">这个函数就像是在<span class="narrative-highlight">' + escapeHtml(entry.metaphor) + '</span>。</span>';

  // 第二段：自然过渡到动作描述 + 输入输出
  let body = '';
  if (matchResult.matchQuality === 'strong') {
    body = '当你把' + escapeHtml(entry.inputDesc) + '交给它，它会' + escapeHtml(entry.action) + '。在这里，' + paramDesc + '，而它交还给你的，' + escapeHtml(entry.outputDesc) + '。';
  } else if (matchResult.matchQuality === 'moderate') {
    body = '简单来说，它做的事情就是' + escapeHtml(entry.action) + '。具体到这段代码，' + paramDesc + '，然后' + outputDesc + '。';
  } else {
    body = '它就像一个' + escapeHtml(entry.metaphor) + '——' + escapeHtml(entry.action) + '。在这段代码中，' + paramDesc + '，然后' + outputDesc + '。';
  }

  // 第三段：使用场景
  let scenarioSentence = generateScenarioSentence(parsed);

  // 额外说明：依赖 + 异常处理
  let extraText = '';
  if (parsed.dependencies.length > 0) {
    extraText += '顺便一提，它干活的时候借用了 ' + parsed.dependencies.length + ' 个外部工具（' +
      parsed.dependencies.slice(0, 3).map(escapeHtml).join('、') +
      (parsed.dependencies.length > 3 ? ' 等' : '') +
      '），就像大厨做菜需要好刀好锅一样，这些工具让它事半功倍。';
  }
  if (parsed.hasTryCatch) {
    extraText += '而且你不用担心它突然罢工——它内置了防护措施，就像汽车的安全气囊，即使中途碰到意外情况，也能从容应对而不让整个程序崩溃。';
  }

  // ---- 拼接 ----
  const mainHtml = '' +
    '<div class="narrative-block">' +
      opening +
      '<p style="margin-top:14px">' + body + '</p>' +
      '<p style="margin-top:14px">' + scenarioSentence + '</p>' +
    '</div>';

  const extraHtml = extraText
    ? '<div class="narrative-extra">' + extraText + '</div>'
    : '';

  const metaHtml = '<p style="margin-top:10px;font-size:0.78rem;color:var(--text2)">' +
    langName + ' 代码片段 &middot; ' + lineCount + ' 行 &middot; ' +
    (matchResult.matchQuality === 'strong' ? '比喻意境匹配度高' : matchResult.matchQuality === 'moderate' ? '比喻意境匹配度中等' : '通用比喻') +
  '</p>';

  return mainHtml + extraHtml + metaHtml;
}

/** 生成一句流畅的使用场景描述 */
function generateScenarioSentence(parsed) {
  const cl = (parsed.methodName + ' ' + parsed.rawCode).toLowerCase();
  const parts = [];

  if (/sort|sorted|排序/.test(cl)) parts.push('需要对一组数据排序时——比如整理用户列表、排列成绩名次、给商品按价格排序');
  if (/filter|筛选|过滤|where/.test(cl)) parts.push('需要从一大堆数据里挑出符合条件的那一小部分时——比如从订单中找出未付款的、从联系人中筛选某个城市的人');
  if (/search|find|查找|搜索/.test(cl)) parts.push('需要在海量数据中快速定位某个目标时——像在一本厚厚的电话簿里找一个人的号码');
  if (/read|读取|load|加载/.test(cl)) parts.push('需要从文件或外部来源获取信息时');
  if (/write|save|保存|写入/.test(cl)) parts.push('需要把处理好的结果记录下来时——比如保存配置、输出报告、写入日志');
  if (/validate|check|验证|校验/.test(cl)) parts.push('需要检查数据是不是符合规则时——格式对不对、有没有漏填、数值是否在合理范围内');
  if (/encrypt|decrypt|加密|解密|hash/.test(cl)) parts.push('需要保护敏感信息不被别人看到时——密码、身份证号、机密数据');
  if (/parse|解析/.test(cl)) parts.push('拿到一堆格式复杂的数据需要拆解成程序能直接用的形式时');
  if (/convert|transform|转换/.test(cl)) parts.push('手头的数据是A格式但下一步需要B格式时——它充当了中间的翻译官');
  if (/calc|compute|sum|avg|计算/.test(cl)) parts.push('需要对一组数字做数学运算时——求和、算平均、找出最大最小值');

  if (parts.length === 0) {
    if (/for\s*\(|while\s*\(|for\s+\w+\s+in/.test(cl)) {
      parts.push('需要一遍遍重复相同的操作，像流水线一样处理数据时');
    } else if (/if\s*\(|if\s+\w+/.test(cl)) {
      parts.push('需要根据不同的情况走不同的处理分支时');
    } else {
      parts.push('在你的程序中需要完成一个特定的处理任务时');
    }
  }

  return '当你' + parts.join('；或者当你') + '，把它叫来就能帮你解决。';
}

/* ==================== 渲染引擎 ==================== */

function renderTechSpec(parsed, lang) {
  const langLabel = lang === 'java' ? 'Java' : 'Python';
  const langBadge = lang === 'java' ? 'badge-java' : 'badge-python';

  const paramsDisplay = parsed.parameters.map(function(p) {
    const typeStr = p.typeInferred
      ? inferredSpan(p.type, p.typeInferReason || 'AI推断：参数类型未显式声明')
      : '<span style="color:var(--text)">' + escapeHtml(p.type) + '</span>';
    return typeStr + ' <span style="color:var(--accent2);font-weight:600">' + escapeHtml(p.name) + '</span>';
  }).join(', ');

  let signature = '';
  if (lang === 'java') {
    const rtSpan = parsed.returnTypeInferred
      ? inferredSpan(parsed.returnType, parsed.returnTypeInferReason || 'AI推断：基于return语句')
      : '<span style="color:var(--text)">' + escapeHtml(parsed.returnType) + '</span>';
    const nmSpan = parsed.methodNameInferred
      ? inferredSpan(parsed.methodName, parsed.methodNameInferReason || 'AI推断：函数名未显式声明')
      : '<span style="color:var(--accent2);font-weight:600">' + escapeHtml(parsed.methodName) + '</span>';
    signature = rtSpan + ' ' + nmSpan + '(' + paramsDisplay + ')';
  } else {
    const nmSpan = parsed.methodNameInferred
      ? inferredSpan(parsed.methodName, parsed.methodNameInferReason || 'AI推断：函数名未显式声明')
      : '<span style="color:var(--accent2);font-weight:600">' + escapeHtml(parsed.methodName) + '</span>';
    signature = 'def ' + nmSpan + '(' + paramsDisplay + ')';
    if (parsed.returnType && parsed.returnType !== 'None' && parsed.returnType !== 'void') {
      const rtSpan = parsed.returnTypeInferred
        ? ' -> ' + inferredSpan(parsed.returnType, parsed.returnTypeInferReason || 'AI推断：基于return语句')
        : ' -> <span style="color:var(--text)">' + escapeHtml(parsed.returnType) + '</span>';
      signature += rtSpan;
    }
  }

  const insight = generateInsight(parsed, parsed.rawCode);

  let paramHtml = '';
  if (parsed.parameters.length > 0) {
    const paramItems = parsed.parameters.map(function(p) {
      let typeHtml;
      if (p.typeInferred) {
        typeHtml = '<span class="param-type inferred" data-tooltip="' + escapeHtml(p.typeInferReason || 'AI推断：类型未显式声明') + '">' + escapeHtml(p.type) + '</span>';
      } else {
        typeHtml = '<span class="param-type fact">' + escapeHtml(p.type) + '</span>';
      }
      return '<li class="param-item">' +
        '<span class="param-name">' + escapeHtml(p.name) + '</span>' +
        '<span class="param-sep">:</span>' +
        typeHtml +
      '</li>';
    }).join('');
    paramHtml = '<ul class="param-list">' + paramItems + '</ul>';
    if (parsed.parameters.some(function(p) { return p.typeInferred; })) {
      paramHtml += '<div style="margin-top:6px;font-size:0.7rem;color:var(--warning)"><em>部分类型基于语义推断，鼠标悬停可查看推断依据</em></div>';
    }
  } else {
    paramHtml = '<p style="color:var(--text2)">无参数</p>';
  }

  let returnHtml;
  if (parsed.returnTypeInferred) {
    returnHtml = inferredSpan(parsed.returnType, parsed.returnTypeInferReason || 'AI推断：基于return语句推断');
  } else {
    returnHtml = '<span class="badge ' + langBadge + '">' + escapeHtml(parsed.returnType) + '</span>';
  }

  let depHtml = '';
  if (parsed.dependencies.length > 0) {
    depHtml = '<ul class="dep-list">' +
      parsed.dependencies.map(function(d) { return '<li>' + escapeHtml(d) + '</li>'; }).join('') +
    '</ul>';
  } else {
    depHtml = '<p style="color:var(--text2)">无外部依赖</p>';
  }

  const tryBadge = parsed.hasTryCatch
    ? '<span class="badge badge-try">包含异常处理（try-catch/except）</span>'
    : '<span class="badge badge-no-try">未检测到异常处理</span>';

  return '' +
    '<div class="spec-section">' +
      '<div class="spec-label">函数签名</div>' +
      '<div class="spec-signature">' + signature + '</div>' +
      '<div class="insight-line">' + escapeHtml(insight) + '</div>' +
      '<div style="margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<span class="badge ' + langBadge + '">' + langLabel + '</span>' +
        (parsed.methodNameInferred ? '<span style="font-size:0.7rem;color:var(--warning)">函数名基于推断</span>' : '') +
        (parsed.returnTypeInferred ? '<span style="font-size:0.7rem;color:var(--warning)">返回值类型基于推断</span>' : '') +
      '</div>' +
    '</div>' +
    '<div class="spec-section">' +
      '<div class="spec-label">参数列表</div>' +
      paramHtml +
    '</div>' +
    '<div class="spec-section">' +
      '<div class="spec-label">返回值</div>' +
      '<p>' + returnHtml + '</p>' +
    '</div>' +
    '<div class="spec-section">' +
      '<div class="spec-label">依赖</div>' +
      depHtml +
    '</div>' +
    '<div class="spec-section">' +
      '<div class="spec-label">异常处理</div>' +
      tryBadge +
    '</div>';
}

function renderBeginnerSpec(parsed, lang, matchResult) {
  return '<div class="spec-section">' + generateNarrativeBeginnerDoc(parsed, lang, matchResult) + '</div>';
}

/* ==================== 主控制器 ==================== */

let lastParsed = null;
let lastLang = 'java';
let lastMatchResult = null;

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 2200);
}

function doParse() {
  const codeInput = document.getElementById('codeInput');
  const errorToast = document.getElementById('errorToast');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const lang = document.getElementById('langSelect').value;
  const code = codeInput.value;

  if (!code.trim()) {
    errorToast.textContent = '代码的意图尚不明朗，请先粘贴一段代码再试。';
    errorToast.classList.add('active');
    return;
  }
  errorToast.classList.remove('active');
  loadingOverlay.classList.add('active');

  setTimeout(function() {
    try {
      let parsed;
      if (lang === 'java') {
        parsed = parseJava(code);
      } else {
        parsed = parsePython(code);
      }

      lastParsed = parsed;
      lastLang = lang;
      lastMatchResult = matchMetaphorEntry(code, parsed);

      const techContent = document.getElementById('techContent');
      document.getElementById('techEmpty').style.display = 'none';
      techContent.innerHTML = renderTechSpec(parsed, lang);
      techContent.style.display = 'block';

      const beginnerContent = document.getElementById('beginnerContent');
      document.getElementById('beginnerEmpty').style.display = 'none';
      beginnerContent.innerHTML = renderBeginnerSpec(parsed, lang, lastMatchResult);
      beginnerContent.style.display = 'block';

      if (typeof Prism !== 'undefined') { Prism.highlightAll(); }
    } catch (err) {
      errorToast.textContent = '代码的意图尚不明朗，请检查输入是否为有效的 Java / Python 函数。';
      errorToast.classList.add('active');
      console.error(err);
    } finally {
      loadingOverlay.classList.remove('active');
    }
  }, 150);
}

function copySpec(type) {
  if (!lastParsed) { showToast('请先解析代码后再复制'); return; }

  let text = '';
  const pd = lastParsed.parameters.map(function(p) { return p.type + ' ' + p.name; }).join(', ');
  const langLabel = lastLang === 'java' ? 'Java' : 'Python';

  if (type === 'tech') {
    const sig = lastLang === 'java'
      ? lastParsed.returnType + ' ' + lastParsed.methodName + '(' + pd + ')'
      : 'def ' + lastParsed.methodName + '(' + pd + ')' +
        (lastParsed.returnType && lastParsed.returnType !== 'void' && lastParsed.returnType !== 'None'
          ? ' -> ' + lastParsed.returnType : '');

    text = '═══ 技术版说明书 (' + langLabel + ') ═══\n\n';
    text += '[函数签名]\n' + sig + '\n\n';
    text += '[参数列表]\n';
    if (lastParsed.parameters.length > 0) {
      lastParsed.parameters.forEach(function(p, i) {
        text += '  ' + (i + 1) + '. ' + p.name + ' : ' + p.type +
          (p.typeInferred ? ' (推断)' : '') + '\n';
      });
    } else { text += '  (无参数)\n'; }
    text += '\n[返回值]\n' + (lastParsed.returnType || 'void') +
      (lastParsed.returnTypeInferred ? ' (推断)' : '') + '\n\n';
    text += '[依赖]\n';
    if (lastParsed.dependencies.length > 0) {
      lastParsed.dependencies.forEach(function(d) { text += '  - ' + d + '\n'; });
    } else { text += '  (无外部依赖)\n'; }
    text += '\n[异常处理]\n' + (lastParsed.hasTryCatch ? '包含 try-catch/except' : '未检测到异常处理') + '\n';
    text += '\n[设计洞察]\n' + generateInsight(lastParsed, lastParsed.rawCode) + '\n';
  } else {
    text = '═══ 小白版说明书 (' + langLabel + ') ═══\n\n';
    const narrativeDiv = document.createElement('div');
    narrativeDiv.innerHTML = generateNarrativeBeginnerDoc(lastParsed, lastLang, lastMatchResult);
    text += narrativeDiv.textContent.trim() + '\n';
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      showToast('已复制到剪贴板！');
    }).catch(function() { fallbackCopy(text); });
  } else { fallbackCopy(text); }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  showToast('已复制到剪贴板！');
}

function exportCard() {
  if (!lastParsed) { showToast('请先解析代码后再导出'); return; }
  if (typeof html2canvas === 'undefined') { showToast('html2canvas 还未加载，请稍后再试'); return; }

  const panel = document.getElementById('outputPanel');
  html2canvas(panel, { scale: 2, backgroundColor: '#161b22' }).then(function(canvas) {
    const link = document.createElement('a');
    link.download = '代码说明书_' + lastParsed.methodName + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('分享卡片已导出！');
  }).catch(function(err) {
    console.error(err);
    showToast('导出失败，请重试');
  });
}

function switchTab(target) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelector('.tab-btn[data-tab="' + target + '"]').classList.add('active');
  document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
  document.getElementById(target + 'Tab').classList.add('active');
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('parseBtn').addEventListener('click', doParse);

  document.getElementById('codeInput').addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      doParse();
    }
    document.getElementById('errorToast').classList.remove('active');
  });

  document.getElementById('copyTechBtn').addEventListener('click', function() { copySpec('tech'); });
  document.getElementById('copyBeginnerBtn').addEventListener('click', function() { copySpec('beginner'); });
  document.getElementById('exportBtn').addEventListener('click', exportCard);

  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { switchTab(this.dataset.tab); });
  });

  document.getElementById('langSelect').addEventListener('change', function() {
    console.log('Switched to ' + (this.value === 'java' ? 'Java' : 'Python'));
  });

  if (typeof Prism !== 'undefined') { Prism.highlightAll(); }
  console.log('代码片段智能说明书生成器已启动');
});
</script>
